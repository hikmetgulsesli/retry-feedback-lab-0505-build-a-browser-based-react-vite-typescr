<!-- SideNavBar (Hidden due to Semantic Shell Mandate for transactional/error states) -->

<!-- Error Icon Container -->
<div class="mb-8 relative flex items-center justify-center w-24 h-24 rounded-full bg-error-container/20 border border-error/30">

</div>

<h1 class="font-display text-display text-on-surface mb-xs">
            Connection to Local Storage Lost
        </h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-xl max-w-sm mx-auto">
            We were unable to save your recent changes. Please ensure your device has sufficient storage space and check your browser settings.
        </p>
<!-- Technical Details Card (Bento Style) -->
<div class="w-full bg-surface-container rounded-xl border border-outline-variant p-md mb-xl text-left">
<div class="flex items-center gap-sm mb-xs border-b border-outline-variant pb-xs">
<span class="material-symbols-outlined text-[16px] text-on-surface-variant" data-icon="info">info</span>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">Diagnostic Info</span>
</div>
<div class="grid grid-cols-2 gap-sm pt-xs">
<div>
<div class="font-label-sm text-label-sm text-on-surface-variant">Error Code</div>
<div class="font-mono-data text-mono-data text-on-surface">ERR_QUOTA_EXCEEDED</div>
</div>
<div>

<div class="font-mono-data text-mono-data text-on-surface">2023-10-27T14:32:01Z</div>
</div>
</div>

<button class="h-[44px] px-lg rounded-DEFAULT bg-primary-container text-on-primary-container font-label-md text-label-md flex items-center justify-center gap-xs hover:opacity-90 transition-opacity min-w-[140px] border border-transparent focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background">
